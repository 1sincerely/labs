<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заказ №101</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; }

  .header { height: 80px; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 32px; gap: 40px; }
  .logo { font-size: 20px; font-weight: 700; }
  .nav { display: flex; gap: 28px; font-size: 14px; color: #333; }
  .avatar { margin-left: auto; width: 32px; height: 32px; border: 1px solid #000; border-radius: 50%; }

  .layout { display: flex; min-height: calc(100vh - 80px); }
  .sidebar { width: 240px; border-right: 1px solid #ccc; padding: 16px 0; }
  .sidebar-item { height: 48px; display: flex; align-items: center; padding: 0 24px; font-size: 14px; color: #333; }
  .sidebar-item.active { background: #f5f5f5; border-left: 3px solid #000; font-weight: 600; color: #000; }

  .content { flex: 1; padding: 32px; }
  .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .page-title { font-size: 24px; font-weight: 700; }

  .btn { height: 44px; padding: 0 20px; border: 1px solid #000; background: #fff; font-size: 14px; cursor: pointer; border-radius: 4px; font-family: inherit; }
  .btn-primary { background: #000; color: #fff; }
  .btn-sm { height: 36px; padding: 0 14px; font-size: 13px; }

  .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .info-row { display: flex; gap: 8px; font-size: 14px; padding: 6px 0; }
  .info-row .label { color: #666; min-width: 80px; }
  .input-sm { height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; width: 200px; }

  .table-wrap { border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 14px 16px; }
  th { background: #f5f5f5; font-weight: 600; border-bottom: 1px solid #ccc; }
  td { border-bottom: 1px solid #eee; }
  tr:last-child td { border-bottom: none; }

  .total { font-size: 20px; font-weight: 700; margin: 24px 0; }
  .status-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
</style>
</head>
<body>

  <div class="header">
    <div class="logo">RESTAURANT</div>
    <div class="nav"><span>Меню</span><span>Заказы</span><span>Отчёты</span></div>
    <div class="avatar"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-item">Главная</div>
      <div class="sidebar-item active">Заказы</div>
      <div class="sidebar-item">Меню</div>
      <div class="sidebar-item">Клиенты</div>
      <div class="sidebar-item">Отчёты</div>
      <div class="sidebar-item">Настройки</div>
    </div>

    <div class="content">
      <div class="page-head">
        <div class="page-title">Заказ №101</div>
        <div style="display:flex; gap:8px;">
          <button class="btn">← Назад</button>
          <button class="btn">Редактировать</button>
        </div>
      </div>

      <div class="card">
        <div class="info-row"><span class="label">Клиент:</span> Иванов И.И.</div>
        <div class="info-row"><span class="label">Дата:</span> 08.09.2026 12:30</div>
        <div class="info-row"><span class="label">Статус:</span>
          <select class="input-sm"><option>Готовится</option></select>
        </div>
      </div>

      <div class="section-title">Состав заказа</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>№</th><th>Блюдо</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>Борщ<br><span style="font-size:12px; color:#666;">острый</span></td><td>2</td><td>350 ₽</td><td>700 ₽</td></tr>
            <tr><td>2</td><td>Стейк</td><td>1</td><td>890 ₽</td><td>890 ₽</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total">ИТОГО: 1 590 ₽</div>

      <div class="status-buttons">
        <button class="btn btn-sm">Принят</button>
        <button class="btn btn-sm btn-primary">Готовится</button>
        <button class="btn btn-sm">Готов</button>
        <button class="btn btn-sm">Выдан</button>
        <button class="btn btn-sm">Оплачен</button>
      </div>

      <button class="btn" style="margin-top:12px;">Отменить заказ</button>
    </div>
  </div>

</body>
</html>
