<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Новый заказ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #000; }

  .header { height: 80px; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 32px; gap: 40px; }
  .logo { font-size: 20px; font-weight: 700; }
  .nav { display: flex; gap: 28px; font-size: 14px; color: #333; }
  .avatar { margin-left: auto; width: 32px; height: 32px; border: 1px solid #000; border-radius: 50%; }

  .layout { display: flex; min-height: calc(100vh - 80px); }
  .sidebar { width: 240px; border-right: 1px solid #ccc; padding: 16px 0; }
  .sidebar-item { height: 48px; display: flex; align-items: center; padding: 0 24px; font-size: 14px; color: #333; }
  .sidebar-item.active { background: #f5f5f5; border-left: 3px solid #000; font-weight: 600; color: #000; }

  .content { flex: 1; padding: 32px; }
  .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .page-title { font-size: 24px; font-weight: 700; }

  .btn { height: 44px; padding: 0 20px; border: 1px solid #000; background: #fff; font-size: 14px; cursor: pointer; border-radius: 4px; font-family: inherit; }
  .btn-primary { background: #000; color: #fff; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .input-sm { height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; width: 100%; }

  .order-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { border: 1px solid #ccc; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 4px; }

  .tabs { display: flex; gap: 8px; }
  .tab { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; cursor: pointer; }
  .tab.active { background: #000; color: #fff; border-color: #000; }

  .dish-card { border: 1px solid #ccc; border-radius: 4px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  .dish-name { font-weight: 600; font-size: 14px; }
  .dish-price { font-size: 13px; color: #666; margin-top: 2px; }

  .cart-item { padding: 12px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
  .cart-item:last-of-type { border-bottom: none; }

  .field-label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; }

  .total { font-size: 20px; font-weight: 700; padding-top: 16px; border-top: 1px solid #ccc; }

  textarea.input-sm { height: 80px; padding: 12px; resize: none; }
</style>
</head>
<body>

  <div class="header">
    <div class="logo">RESTAURANT</div>
    <div class="nav"><span>Меню</span><span>Заказы</span><span>Отчёты</span></div>
    <div class="avatar"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-item">Главная</div>
      <div class="sidebar-item active">Заказы</div>
      <div class="sidebar-item">Меню</div>
      <div class="sidebar-item">Клиенты</div>
      <div class="sidebar-item">Отчёты</div>
      <div class="sidebar-item">Настройки</div>
    </div>

    <div class="content">
      <div class="page-head">
        <div class="page-title">Новый заказ</div>
        <div style="display:flex; gap:8px;">
          <button class="btn">Отмена</button>
          <button class="btn btn-primary">Сохранить</button>
        </div>
      </div>

      <div class="order-grid">

        <div class="panel">
          <div class="panel-title">Блюда</div>
          <div class="tabs">
            <div class="tab active">Супы</div>
            <div class="tab">Горячее</div>
            <div class="tab">Салаты</div>
          </div>
          <input class="input-sm" placeholder="Поиск блюда...">

          <div class="dish-card">
            <div>
              <div class="dish-name">Борщ</div>
              <div class="dish-price">350 ₽ / 300 г</div>
            </div>
            <button class="btn btn-sm btn-primary">+ Добавить</button>
          </div>
          <div class="dish-card">
            <div>
              <div class="dish-name">Солянка</div>
              <div class="dish-price">400 ₽ / 350 г</div>
            </div>
            <button class="btn btn-sm btn-primary">+ Добавить</button>
          </div>
          <div class="dish-card">
            <div>
              <div class="dish-name">Крем-суп</div>
              <div class="dish-price">320 ₽ / 250 г</div>
            </div>
            <button class="btn btn-sm btn-primary">+ Добавить</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Корзина</div>

          <div class="cart-item">
            <div>
              <div>Борщ</div>
              <div style="font-size:12px; color:#666;">острый</div>
            </div>
            <div>2 × 350 ₽ = 700 ₽</div>
          </div>
          <div class="cart-item">
            <div>Стейк</div>
            <div>1 × 890 ₽ = 890 ₽</div>
          </div>

          <div style="margin-top:16px;">
            <label class="field-label">Клиент</label>
            <select class="input-sm"><option>Иванов И.И.</option></select>
          </div>

          <div>
            <label class="field-label">Комментарий</label>
            <textarea class="input-sm" placeholder="Особые пожелания..."></textarea>
          </div>

          <div class="total">ИТОГО: 1 590 ₽</div>

          <button class="btn btn-primary" style="height:48px;">Создать заказ</button>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
