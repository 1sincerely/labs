<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — RESTAURANT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f5; color: #000;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 400px; background: #fff;
    border: 1px solid #ccc; border-radius: 8px;
    padding: 40px; display: flex; flex-direction: column; gap: 16px;
  }
  .title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 16px; }
  .label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; }
  .input {
    width: 100%; height: 44px; padding: 0 12px;
    border: 1px solid #ccc; border-radius: 4px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .btn {
    height: 48px; border: none; border-radius: 4px;
    background: #000; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit;
    margin-top: 8px;
  }
  .foot { text-align: center; font-size: 13px; color: #666; margin-top: 8px; }
  .foot a { color: #000; }
</style>
</head>
<body>
  <form class="card">
    <div class="title">RESTAURANT</div>
    <div>
      <label class="label">Логин</label>
      <input class="input" type="text" placeholder="admin">
    </div>
    <div>
      <label class="label">Пароль</label>
      <input class="input" type="password" placeholder="••••••••">
    </div>
    <button class="btn" type="submit">ВОЙТИ</button>
    <div class="foot">Нет аккаунта? <a href="#">Зарегистрироваться</a></div>
  </form>
</body>
</html>
